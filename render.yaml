services:
  # ─────────────────────────────────────────────
  # Python FastAPI ML Service
  # ─────────────────────────────────────────────
  - type: web
    name: lifemap-ml-service
    runtime: docker
    dockerfilePath: ./ml_service/Dockerfile
    dockerContext: ./ml_service
    plan: free
    envVars:
      - key: PORT
        value: 8000

  # ─────────────────────────────────────────────
  # Node.js Express Backend
  # ─────────────────────────────────────────────
  - type: web
    name: lifemap-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FASTAPI_URL
        fromService:
          name: lifemap-ml-service
          type: web
          property: host
      - key: DATABASE_URL
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard
